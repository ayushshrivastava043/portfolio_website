services:
  - type: web
    name: portfolio-chatbot-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn enhanced_agentic_chatbot:app --bind 0.0.0.0:$PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
