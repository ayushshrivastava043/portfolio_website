name: Deploy Portal to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install & build
        working-directory: portal
        env:
          NODE_ENV: production
          # Project site: ayushshrivastava043.github.io/portfolio_website
          NEXT_PUBLIC_BASE_PATH: /portfolio_website
        run: |
          npm ci
          npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: portal/out
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy Next.js portal"
