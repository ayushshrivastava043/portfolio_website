name: Deploy Portal to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "portal/**"
      - ".github/workflows/deploy-portal.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install & build
        working-directory: portal
        env:
          NEXT_PUBLIC_BASE_PATH: /portfolio_website
        run: |
          npm ci
          npm run build

      - name: Publish to docs/ (GitHub Pages source)
        run: |
          rm -rf docs
          cp -R portal/out docs
          touch docs/.nojekyll

      - name: Commit docs and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "No docs changes"
            exit 0
          fi
          git commit -m "chore: publish portal static build to docs/ [skip ci]"
          git push
